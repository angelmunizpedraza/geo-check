[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-check"
version = "0.3.0"
description = "Score whether ChatGPT, Perplexity, Claude and Google AI Overviews can reach, read and cite a site."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ángel Muñiz Pedraza", email = "angelhd029@gmail.com" }]
keywords = ["geo", "seo", "ai-search", "llms-txt", "chatgpt", "perplexity", "robots-txt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.31.0", "beautifulsoup4>=4.12.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/angelmunizpedraza/geo-check"
Issues = "https://github.com/angelmunizpedraza/geo-check/issues"

[project.scripts]
geo-check = "geo_check.__main__:main"

[tool.setuptools.packages.find]
include = ["geo_check*"]
