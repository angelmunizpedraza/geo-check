name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: The console script must exist
        run: geo-check --help

  action:
    name: The action must run against a real site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run this repository's own action
        uses: ./
        with:
          url: https://example.com
          min-score: ""
          fail-if-blocked: "false"
          json: example-com.json
      - name: The report must exist
        run: test -s example-com.json
